[env:esp12e]
platform = espressif8266
framework = arduino
board = esp12e

board_build.filesystem = littlefs
board_build.flash_mode = dout

extra_scripts = 
    pre:scripts/preIncrementBuildNumber.py
;   Enable the line below only when using OTA upload (upload_protocol = custom):
;   platformio_upload.py

custom_major_build_number = v1.2.

lib_deps =
    bblanchon/ArduinoJson @ ^6.18.5
    knolleary/PubSubClient @ ^2.8
    paulstoffregen/Time @ ^1.6.1
    sstaub/Ticker @ ^4.4.0
    jchristensen/Timezone @ ^1.2.4
    makuna/NeoPixelBus @ ^2.6.9
    arduino-libraries/NTPClient @ ^3.2.1
    bxparks/AceSorting @ ^1.0.0
    esphome/ESPAsyncTCP-esphome @ ^2.0.0
    https://github.com/me-no-dev/ESPAsyncWebServer
    ayushsharma82/ElegantOTA @ ^3.1.0

build_flags =
    '-DELEGANTOTA_USE_ASYNC_WEBSERVER = 1'
    '-DMQTT_CUSTOMER = "viktak"'
    '-DMQTT_PROJECT = "spiti"'
    '-D__localNTP = 0'
    '-D__debugSettings = "1"'

;  ---- Serial upload (default): auto-detects the COM port ----
upload_protocol = esptool
upload_speed = 115200

;  ---- OTA upload via ElegantOTA (uncomment and set your device IP) ----
; upload_protocol = custom
; custom_upload_url = http://<device-ip>
; custom_username = admin
; custom_password = admin

monitor_speed = 115200
monitor_filters =
    colorize
    esp8266_exception_decoder
